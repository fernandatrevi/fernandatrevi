name: Generate blue contribution snake

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated blue snake on a light contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fernandatrevi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563eb&color_dots=%23f0f6ff,%23bfdbfe,%2393c5fd,%2360a5fa,%232563eb

      - name: Generate live annual contribution counter
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const login = 'fernandatrevi';
            const data = await github.graphql(
              `query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar { totalContributions }
                  }
                }
              }`,
              { login }
            );
            const total = Number(data.user.contributionsCollection.contributionCalendar.totalContributions);
            if (!Number.isFinite(total)) throw new Error('Unable to retrieve contribution total');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="880" height="58" viewBox="0 0 880 58"><title>${total.toLocaleString('en-US')} contributions in the last year</title><text x="440" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#163a63">${total.toLocaleString('en-US')} contributions in the last year</text></svg>`;
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/contributions-count.svg', svg);

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
