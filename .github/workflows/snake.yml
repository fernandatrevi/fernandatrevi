name: Generate blue contribution snake

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated blue snake on a light contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: fernandatrevi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232563eb&color_dots=%23f0f6ff,%23bfdbfe,%2393c5fd,%2360a5fa,%232563eb

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
